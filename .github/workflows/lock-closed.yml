name: "Lock old issues and pull requests"
on:
  schedule:
    - cron: "0 9 1 * *"

permissions:
  # Lock discussions.
  discussions: write
  # Lock issues.
  issues: write
  # Lock pull requests.
  pull-requests: write

jobs:
  lock:
    uses: mdn/workflows/.github/workflows/lock-closed.yml@5c0fe55eace1852dc2a10875c3a399750f5e72be  # main
    with:
      target-repo: "mdn/content"
